name: Link Check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 08:00 UTC — catches links that rotted since the last push.
    - cron: "0 8 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,403
            './**/*.md'
          fail: true
